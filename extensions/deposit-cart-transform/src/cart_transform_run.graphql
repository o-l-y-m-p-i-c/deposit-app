query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            id
            title
            hasAnyTag(tags: [])
            inAnyCollection(ids: [])
          }
        }
      }
    }
  }
  cartTransform {
    metafield(namespace: "$app:deposit", key: "function-configuration") {
      value
    }
  }
}
