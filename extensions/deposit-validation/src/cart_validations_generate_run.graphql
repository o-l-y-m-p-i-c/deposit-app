query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            # Deposit units per product unit, written by the app's
            # eligibility sync (absent = no deposit)
            bottles: metafield(namespace: "$app:deposit", key: "bottles") {
              value
            }
            # Per-drink deposit style: this drink's own deposit variant
            depositVariant: metafield(namespace: "$app:deposit", key: "deposit_variant") {
              value
            }
            # True on the per-drink deposit products themselves
            isDepositItem: hasAnyTag(tags: ["bottle-deposit-item"])
          }
        }
      }
    }
  }
  validation {
    metafield(namespace: "$app:deposit", key: "function-configuration") {
      value
    }
  }
}
