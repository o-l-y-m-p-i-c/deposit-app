services:
  - type: web
    name: deposit-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooler) URL — used only by `prisma migrate deploy`,
      # whose advisory lock times out through the pooler
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_inventory,write_inventory,read_products,write_products,write_cart_transforms,read_validations,write_validations,read_publications,write_publications,read_metaobjects,write_metaobjects,read_orders,read_themes
